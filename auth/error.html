<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login Error - REAPER Script</title>
	<link rel="stylesheet" href="../styles.css">
	<style>
		body {
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			margin: 0;
			background: linear-gradient(135deg, #07110c 0%, #0a1a12 100%);
			font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
		}
		.container {
			background: rgba(255, 255, 255, 0.05);
			backdrop-filter: blur(10px);
			border-radius: 16px;
			padding: 48px;
			max-width: 600px;
			width: 90%;
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
			border: 1px solid rgba(255, 255, 255, 0.1);
		}
		.error-icon {
			width: 64px;
			height: 64px;
			margin: 0 auto 24px;
			background: #ff4444;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 32px;
		}
		h1 {
			color: #fff;
			text-align: center;
			margin: 0 0 16px;
			font-size: 28px;
			font-weight: 700;
		}
		.message {
			color: rgba(255, 255, 255, 0.8);
			text-align: center;
			margin: 0 0 32px;
			font-size: 16px;
		}
		.error-details {
			background: rgba(255, 68, 68, 0.1);
			border: 1px solid rgba(255, 68, 68, 0.3);
			border-radius: 8px;
			padding: 16px;
			margin: 24px 0;
			color: #ff8888;
			font-family: 'Courier New', monospace;
			font-size: 14px;
		}
		.button {
			display: block;
			width: 100%;
			background: #289F81;
			color: white;
			border: none;
			padding: 14px 24px;
			border-radius: 8px;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.2s;
			text-align: center;
			text-decoration: none;
			margin-top: 16px;
		}
		.button:hover {
			background: #2fb896;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="error-icon">✗</div>
		<h1>Authentication Error</h1>
		<p class="message">There was a problem authenticating with Google.</p>
		
		<div class="error-details" id="errorDetails">
			Loading error details...
		</div>
		
		<a href="/" class="button">Return to Home</a>
	</div>

	<script>
		const urlParams = new URLSearchParams(window.location.search);
		const error = urlParams.get('error') || 'Unknown error';
		document.getElementById('errorDetails').textContent = decodeURIComponent(error);
	</script>
</body>
</html>
